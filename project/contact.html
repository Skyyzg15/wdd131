<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Glow Skin</title> 
    <meta name="description" content="This page is about you, and the care of your skin!">
    <meta name="author" content="Cielo Zegarra">
    <link rel="stylesheet" href="styles/project.css">
    <link rel="stylesheet" href="styles/project-large.css">
    <script src="scripts/project.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
       <img src="images/logo.png" alt="Website Logo">
       <button id="menu"></button>

        <nav class="navigation wrap">
           <a href="project.html">Home</a>
           <a href="products.html">Products</a>
           <a href="about.html">About Us</a>
           <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>Personalize your Skincare Routine and Register</h1>
          <p>Fill your information below and get in touch with us for updates!.</p>

        <section class="routine-builder">
             <h2>Match and save your skin type</h2>
             
             <form id="preference-form">
               <label for="skin-select">Skin Type:</label>
               <select id="skin-select" name="skin-select">
                  <option value="Dry">Dry Skin</option>
                  <option value="Oily">Oily Skin</option>
                  <option value="Combination">Combination Skin</option>
                  <option value="Sensitive">Sensitive Skin</option>
              </select>
              <button type="submit" id="save-pref">Save Preference</button>
            </form>
            <p id="welcome-message" class="dynamic-msg"></p>
       </section>

       <section class="contact-section">
         <form method="get" action="thanks.html" class="contact-form">
           <fieldset>
             <div>Your information</div>
             <label>First Name <input type="text" name="fname" required></label>
             <label>Last Name <input type="text" name="lname" required></label>
             <label>Email <input type="email" name="email" placeholder="someone@gmail.com" required></label>

             <input type="submit" value="Sign up">
         </fieldset>
       </form>
     </section>
    </main>
    <footer>
        <p> &copy;<span id="currentyear"></span> | Glow Skin | Peru </p>
        <p><a href="siteplan.html"></a></p>
    </footer>
</body>
</html>
